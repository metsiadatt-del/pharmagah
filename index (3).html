<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#326f64">
  <meta name="description" content="فارم‌آگاه؛ فضای پژوهش فارسی برای داروسازی و علوم پزشکی با جست‌وجوی مقالات، آرشیو محلی و خروجی گزارش">
  <title>فارم‌آگاه | دستیار پژوهش پزشکی</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- APP_STYLES -->
</head>
<body>
  <div id="app"><section id="startup-status" style="max-width:640px;margin:12vh auto;padding:32px;background:#fffdfa;border:1px solid #e6e0d8;border-radius:16px">
    <h1>فارم‌آگاه</h1>
    <p id="startup-message" role="status">در حال آماده‌سازی میز پژوهش… اگر این پیام باقی ماند، صفحه را با مرورگر به‌روز باز کنید و یک بار بازخوانی کامل انجام دهید.</p>
    <noscript><p>جاوااسکریپت مرورگر خاموش است؛ برای استفاده از برنامه آن را فعال کنید.</p></noscript>
  </section></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <script>
    window.addEventListener('error', function () {
      var message = document.getElementById('startup-message');
      if (message) message.textContent = 'راه‌اندازی برنامه با خطا روبه‌رو شد. صفحه را با Ctrl+Shift+R تازه‌سازی کنید؛ اگر مشکل باقی ماند، نشانی سایت و تصویر خطای Console را ارسال کنید.';
    });
  </script>
  <!-- APP_SCRIPT -->
</body>
</html>
